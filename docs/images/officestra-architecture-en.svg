<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Independent AI. Shared knowledge.</title>
<desc id="desc">Choose a CLI and model for each of five independent coworker sessions. Coworkers exchange tasks and replies via API and use shared local records.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071820"/><stop offset="1" stop-color="#111c2c"/></linearGradient></defs>
<rect width="1200" height="1000" rx="28" fill="url(#bg)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
<text x="60" y="65" font-size="38" fill="#f4fafc" text-anchor="start" font-weight="700">Independent AI. Shared knowledge.</text>
<text x="60" y="107" font-size="24" fill="#a6bdc9" text-anchor="start" font-weight="500">OFFICESTRA · Choose models. Connect coworkers.</text>
<rect x="60" y="151" width="230" height="76" rx="18" fill="#153937" stroke="#51cdbb" stroke-width="1.5"/><text x="175" y="199" font-size="28" fill="#e5fff9" text-anchor="middle" font-weight="600">You</text>
