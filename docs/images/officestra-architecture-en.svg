<rect x="750" y="151" width="390" height="76" rx="18" fill="#11252d" stroke="#29414d" stroke-width="1.5"/><text x="945" y="199" font-size="28" fill="#c5e7ff" text-anchor="middle" font-weight="600">Real terminal</text>
<path d="M555 230V267 M548 259L555 267L562 259 M945 230V267 M938 259L945 267L952 259" stroke="#64d6cd" stroke-width="2.5" fill="none"/>
<rect x="40" y="278" width="1120" height="684" rx="24" fill="#0b1d27" stroke="#34505c" stroke-width="1.5"/>
<text x="68" y="318" font-size="23" fill="#7fe3d3" text-anchor="start" font-weight="600">OFFICESTRA on your Mac</text>
<text x="600" y="365" font-size="28" fill="#f1f7fb" text-anchor="middle" font-weight="600">Choose a CLI and model for each coworker</text>
